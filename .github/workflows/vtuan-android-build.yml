name: Build VTUAN Android v1.6 overlay APK
on:
  workflow_dispatch:
  push:
    branches: [vtuan-android-build]
    paths:
      - 'vtuan_android/**'
      - '.github/workflows/vtuan-android-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDKM=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack baseline V1.4 and verify integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zlib,hashlib
          root=Path('vtuan_android')
          for name,checksum in [
              ('MainActivity.java','3ebc531c57ac8d3e32f2cc27fa9a2ecd87743b092dd420f4da17e585492a4e06'),
              ('SecureKeyStore.java','d4c0157672f42a012811205834fd906245ae071da33551676d1fb1a10c2616e1')
          ]:
              raw=(root/'source_v1_4'/(name+'.z')).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==checksum, name
              dest=root/'app/src/main/java/com/vtuan/lqmenu'/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(zlib.decompress(raw))
          PY
      - name: Prepare V1.4 Gradle version for upgrader
        run: |
          cp vtuan_android/app/build.gradle /tmp/vtuan_v16_build.gradle
          sed -i -e 's/versionCode 7/versionCode 5/' -e "s/versionName '1.6'/versionName '1.4'/" vtuan_android/app/build.gradle
      - name: Upgrade V1.5
        run: |
          python3 - <<'PY'
          import hashlib,zlib
          from pathlib import Path
          blob=Path('vtuan_android/tools/upgrade_v15.py.z').read_bytes()
          assert hashlib.sha256(blob).hexdigest()=='a2f1bae99d7d0367bb1e7cf8bcaefde69106f3e6fb092435eed13dea05ad7c7e'
          Path('vtuan_android/tools/upgrade_v15.py').write_bytes(zlib.decompress(blob))
          PY
          python3 vtuan_android/tools/upgrade_v15.py vtuan_android
          grep -q 'PHIÊN BẢN 1.5' vtuan_android/app/src/main/java/com/vtuan/lqmenu/MainActivity.java
      - name: Upgrade V1.6 floating overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zlib,hashlib
          base=Path('vtuan_android')
          specs=[
              ('upgrade_v16.patch.z','839c4784fc47d9d68a305eb8bd3304f6a1d685a4f9bd606bae636012700a25e1','upgrade_v16.patch'),
              ('OverlayService.java.z','3091013a86c3a3ba0858e3d3dc77030012c0b91f34d9c5e25e2de97e58cc76de','OverlayService.java')
          ]
          for file_name,sha,target in specs:
              compressed=(base/'tools'/file_name).read_bytes()
              assert hashlib.sha256(compressed).hexdigest()==sha, file_name+' failed SHA256'
              destination=(base/'tools'/target) if target.endswith('.patch') else (base/'app/src/main/java/com/vtuan/lqmenu'/target)
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(zlib.decompress(compressed))
          PY
          git apply --check vtuan_android/tools/upgrade_v16.patch
          git apply vtuan_android/tools/upgrade_v16.patch
          cp /tmp/vtuan_v16_build.gradle vtuan_android/app/build.gradle
          grep -q 'PHIÊN BẢN 1.6' vtuan_android/app/src/main/java/com/vtuan/lqmenu/MainActivity.java
          grep -q 'Bật menu nổi VTUAN' vtuan_android/app/src/main/java/com/vtuan/lqmenu/MainActivity.java
          grep -q "versionName '1.6'" vtuan_android/app/build.gradle
      - name: Build APK
        run: gradle --no-daemon -p vtuan_android assembleDebug
      - name: Verify debug signing and manifest
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK=vtuan_android/app/build/outputs/apk/debug/app-debug.apk
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -30
          unzip -t "$APK" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: VTUAN-ANDROID-V1-6-OVERLAY-APK
          path: vtuan_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
