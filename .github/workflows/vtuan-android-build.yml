name: Build VTUAN Android v1.3 APK
on:
  workflow_dispatch:
  push:
    branches: [vtuan-android-build]
    paths:
      - 'vtuan_android/**'
      - '.github/workflows/vtuan-android-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract application project
        run: mkdir -p vtuan_android/code && unzip vtuan_android/app-source.zip -d vtuan_android/code
      - name: Build APK
        run: gradle --no-daemon -p vtuan_android/code assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VTUAN-ANDROID-V1-3-APK
          path: vtuan_android/code/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
