name: MinDo V5 Read-Only Diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'readonly-diagnostic/**'
      - 'project-diagnostic.yml'
      - '.github/workflows/build-mindo-v5-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS project
        run: xcodegen generate --spec project-diagnostic.yml
      - name: Build unsigned app
        run: |
          xcodebuild -project MinDoReadOnlyCheck.xcodeproj -target MinDoReadOnlyCheck -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CONFIGURATION_BUILD_DIR="$PWD/build/diagnostic"
      - name: Create unsigned IPA
        run: |
          test -d build/diagnostic/MinDoReadOnlyCheck.app
          mkdir -p Payload
          cp -R build/diagnostic/MinDoReadOnlyCheck.app Payload/
          zip -qry MinDo-V5-Diagnostic-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MinDo-V5-Diagnostic-unsigned
          path: MinDo-V5-Diagnostic-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
