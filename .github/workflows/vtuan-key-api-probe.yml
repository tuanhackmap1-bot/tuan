name: Probe VTUAN key API routes (no real key)
on:
  workflow_dispatch:
  push:
    branches: [vtuan-v4-native-audit]
    paths:
      - '.github/workflows/vtuan-key-api-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe HTTPS endpoint routes without any key material
        shell: bash
        env:
          HOST: https://vtuan-103-159-51-231.sslip.io
        run: |
          set +e
          for path in /healthz /api/activate /api/verify /api/sv/test-ctv/activate /api/sv/test-ctv/verify; do
            printf 'GET %s => ' "$path"
            curl --silent --show-error --max-time 12 --connect-timeout 5 \
              --output /dev/null --write-out '%{http_code}\n' "$HOST$path" || echo '(connection failed)'
          done
          echo "POST probe uses only a definitely invalid diagnostic key."
          for path in /api/activate /api/verify /api/v1/activate /api/v1/check /api/sv/test-ctv/verify; do
            printf 'POST %s => ' "$path"
            curl --silent --show-error --max-time 12 --connect-timeout 5 \
              --header 'Content-Type: application/json' \
              --data '{"key":"VTUAN-NONEXISTENT-DIAGNOSTIC-KEY-NO-REAL-KEY","device_id":"VTUAN-DIAGNOSTIC"}' \
              --output /dev/null --write-out '%{http_code}\n' "$HOST$path" || echo '(connection failed)'
          done
          echo "Inspecting only public error schema for an intentionally invalid key."
          for path in /api/activate /api/verify /api/sv/test-ctv/verify; do
            body=$(mktemp)
            code=$(curl --silent --max-time 12 --connect-timeout 5 \
              --header 'Content-Type: application/json' \
              --data '{"key":"VTUAN-NONEXISTENT-DIAGNOSTIC-KEY-NO-REAL-KEY"}' \
              --output "$body" --write-out '%{http_code}' "$HOST$path")
            python3 - "$path" "$code" "$body" <<'PY'
          import json,sys
          path,code,filename=sys.argv[1:]
          with open(filename,'rb') as f:
              raw=f.read(4096)
          try:
              obj=json.loads(raw)
              if isinstance(obj,dict):
                  print(path, code, 'JSON keys:',sorted(obj), 'ok:',obj.get('ok'))
              else:
                  print(path,code,'JSON type:',type(obj).__name__)
          except Exception:
              print(path,code,'non-JSON response')
          PY
            rm -f "$body"
          done
