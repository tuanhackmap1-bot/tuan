name: Build VTUAN V4 purple key gate
on:
  workflow_dispatch:
  push:
    branches: [vtuan-android-build]
    paths:
      - 'vtuan_android/gate_v4/**'
      - '.github/workflows/vtuan-v4-purple-gate.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile key gate
        run: |
          mkdir -p /tmp/keys /tmp/dex
          javac -source 8 -target 8 -encoding UTF-8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/keys vtuan_android/gate_v4/KeyActivity.java
          jar cf /tmp/keys.jar -C /tmp/keys .
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 23 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output /tmp/dex /tmp/keys.jar
          mv /tmp/dex/classes.dex /tmp/dex/classes7.dex
          test -s /tmp/dex/classes7.dex
      - uses: actions/upload-artifact@v4
        with:
          name: VTUAN-V4-PURPLE-KEY-DEX
          path: /tmp/dex/classes7.dex
          if-no-files-found: error
