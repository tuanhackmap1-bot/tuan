name: Check VTUAN V10 health for V4 test
on:
  push:
    branches: [vtuan-v4-apk-diagnostics]
    paths:
      - .github/workflows/v4-check-vtuan.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configured server without sending a key
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,ssl
          url='https://vtuan-103-159-51-231.sslip.io/healthz'
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'VTUAN V4 Compatibility Check'})
              with urllib.request.urlopen(req,timeout=10) as response:
                  b=response.read(2000)
                  print("HEALTH_STATUS",response.status)
                  print("HEALTH_BODY",b.decode('utf-8','replace'))
          except Exception as e:
              print("HEALTH_ERROR",type(e).__name__,str(e))
          for endpoint in ('/api/activate', '/api/verify'):
            url='https://vtuan-103-159-51-231.sslip.io'+endpoint
            test=urllib.request.Request(url,
                data=b'{"key":"vtuan-invalid-api-check-not-a-real-license","device_id":"testmachine","machine_code":"testmachine"}',
                headers={'Content-Type':'application/json; charset=utf-8'},
                method='POST')
            try:
                with urllib.request.urlopen(test,timeout=10) as response:
                    print("CHECK_STATUS",endpoint,response.status)
                    print("CHECK_BODY",endpoint,response.read(1200).decode('utf-8','replace'))
            except urllib.error.HTTPError as e:
                print("CHECK_STATUS",endpoint,e.code)
                print("CHECK_BODY",endpoint,e.read(1200).decode('utf-8','replace'))
            except Exception as e:
                print("CHECK_ERROR",endpoint,type(e).__name__,str(e))
          PY
