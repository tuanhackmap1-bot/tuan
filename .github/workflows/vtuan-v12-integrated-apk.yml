name: Build VTUAN key inside provided APK
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct HTTPS URL to an APK you are authorized to modify'
        required: true
        type: string
      apk_sha256:
        description: 'Expected SHA256 of original APK (recommended)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKM=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download original APK and verify optional SHA256
        env:
          APK_URL: ${{ inputs.apk_url }}
          EXPECTED_SHA256: ${{ inputs.apk_sha256 }}
        run: |
          case "$APK_URL" in https://*) ;; *) echo "Only HTTPS APK URLs accepted"; exit 1 ;; esac
          curl -fLsS --retry 3 --max-time 900 "$APK_URL" -o /tmp/source.apk
          test -s /tmp/source.apk
          test "$(stat -c%s /tmp/source.apk)" -lt 629145600
          unzip -t /tmp/source.apk | tail -1
          if [ -n "$EXPECTED_SHA256" ]; then
            echo "$EXPECTED_SHA256  /tmp/source.apk" | sha256sum -c -
          fi
      - name: Build VTUAN key gate
        run: gradle --no-daemon -p vtuan_android/gate_v4 :app:assembleDebug
      - name: Download checksum-verified Apktool
        run: |
          curl -fLsS --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          echo '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  /tmp/apktool.jar' | sha256sum -c -
      - name: Inject VTUAN launcher and sign new APK
        run: |
          python3 vtuan_android/tool_v12_key_patch/patch_host.py \
            --apk /tmp/source.apk \
            --gate vtuan_android/gate_v4/app/build/outputs/apk/debug/app-debug.apk \
            --apktool /tmp/apktool.jar \
            --output /tmp/TTS_TOOL_V12.1_VTUAN_KEY_PATCHED.apk \
            --keystore /tmp/vtuan-build-debug.jks \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --zipalign "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/TTS_TOOL_V12.1_VTUAN_KEY_PATCHED.apk | grep -F "launchable-activity: name='com.vtuan.gate.KeyActivity'"
      - uses: actions/upload-artifact@v4
        with:
          name: VTUAN-V12-INTEGRATED-KEY-APK
          path: /tmp/TTS_TOOL_V12.1_VTUAN_KEY_PATCHED.apk
          retention-days: 7
          if-no-files-found: error
