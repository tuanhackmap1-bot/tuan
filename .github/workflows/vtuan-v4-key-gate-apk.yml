name: Build standalone VTUAN V4 key gate APK
on:
  workflow_dispatch:
  push:
    branches: [vtuan-v4-native-audit]
    paths:
      - 'vtuan_android/gate_v4/**'
      - 'vtuan_android/gate_v4_tests/**'
      - '.github/workflows/vtuan-v4-key-gate-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test key expiration parsing on JVM
        run: |
          mkdir -p /tmp/vtuan-key-tests
          javac -encoding UTF-8 -d /tmp/vtuan-key-tests \\
            vtuan_android/gate_v4/KeyExpiry.java \\
            vtuan_android/gate_v4_tests/KeyExpiryTest.java
          java -cp /tmp/vtuan-key-tests com.vtuan.gate.KeyExpiryTest
      - name: Install Android SDK
        run: |
          SDKM=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build standalone debug APK
        run: gradle --no-daemon -p vtuan_android/gate_v4 :app:assembleDebug
      - name: Validate APK package, signature and archive
        run: |
          APK=vtuan_android/gate_v4/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.vtuan.gate'"
          unzip -t "$APK" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: VTUAN-V4-STANDALONE-KEY-APK
          path: vtuan_android/gate_v4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
