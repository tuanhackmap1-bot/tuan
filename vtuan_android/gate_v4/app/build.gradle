plugins { id 'com.android.application' }
android {
    namespace 'com.vtuan.gate'
    compileSdk 35
    defaultConfig {
        applicationId 'com.vtuan.gate'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    sourceSets {
        main {
            java.srcDirs = ['..']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
