name: Inspect V4 endpoint hints
on:
  push:
    branches: [vtuan-v4-apk-diagnostics]
    paths:
      - .github/workflows/v4-apk-endpoints.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Examine public binary endpoint strings without execution
        run: |
          python3 - <<'PY'
          import urllib.request,pathlib,zipfile,re
          from urllib.parse import urlsplit
          u="https://appinstall.cloud/package-cache/7jbdxgs77777/nmj0zeu-f3523-fast.apk?pcv=20260910-direct-cdn-v1&r2p=1"
          with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=60) as r,open("/tmp/v4.apk","wb") as f:
              while b:=r.read(1048576):f.write(b)
          with zipfile.ZipFile("/tmp/v4.apk") as z:
              b=z.read("lib/arm64-v8a/libysmteam.so")
          txt=re.findall(rb"[\x20-\x7e]{6,}",b)
          for i,s in enumerate(txt):
              if b"keymanager.website" in s.lower():
                  print("KEYMANAGER_STR",i,repr(s[:170]))
                  print("ADJACENT_STRINGS",[repr(x[:90]) for x in txt[max(0,i-5):i+6]])
          for s in txt:
              low=s.lower()
              if (b"api/" in low or b"/auth" in low or b"license" in low or b"/login" in low or b"/activate" in low or b"keymanager" in low) and len(s)<200:
                  if b"authorization:" in low or b"bearer " in low: continue
                  print("ENDPOINT_HINT",repr(s))
          PY
