name: Build MinDo RootHide v06 (legacy experimental)
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup RootHide Theos
        uses: iossxx/theos-action@760b7475c8b98f4d8fd8d52735728e22186b2aeb
        with:
          theos-dir: theos
          theos-src: https://github.com/roothide/theos
          theos-sdks: https://github.com/theos/sdks
          orion: 'false'
      - name: Validate and build RootHide DEB
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euxo pipefail
          cd mindo-roothide-v06
          gzip -dc MinDoOverlay.c.gz > MinDoOverlay.c
          echo "e2ee6bb7120d7d77b0926073d79733556a8a034d056aa743b078406103e313a9  MinDoOverlay.c" | shasum -a 256 -c -
          python3 tests/test_config.py
          make clean package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
          find packages -type f -name '*.deb' -print
      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinDo-RootHide-legacy-DEB
          path: mindo-roothide-v06/packages/*.deb
          if-no-files-found: error
