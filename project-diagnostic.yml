name: MinDoReadOnlyCheck
options:
  bundleIdPrefix: dev.mindo
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  MinDoReadOnlyCheck:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: readonly-diagnostic/DiagnosticView.swift
    info:
      path: readonly-diagnostic/Info.plist
      properties:
        CFBundleDisplayName: MinDo CHECK
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        LSApplicationQueriesSchemes:
          - freefire
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mindo.readonlycheck
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
