name: Build VTUAN Android v1.3 APK
on:
  workflow_dispatch:
  push:
    branches: [vtuan-android-build]
    paths:
      - 'vtuan_android/**'
      - '.github/workflows/vtuan-android-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDKM=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon -p vtuan_android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VTUAN-ANDROID-V1-3-APK
          path: vtuan_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
