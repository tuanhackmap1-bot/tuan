name: Validate VTUAN key injection into host APK
on:
  workflow_dispatch:
  push:
    branches: [vtuan-v4-native-audit]
    paths:
      - 'vtuan_android/tool_v12_key_patch/**'
      - 'vtuan_android/gate_v4/**'
      - '.github/workflows/vtuan-v12-host-patch-test.yml'
permissions:
  contents: read
jobs:
  patch-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit-test manifest rewriting and dex addition
        run: python3 -m unittest -v vtuan_android/tool_v12_key_patch/test_patch_host.py
      - name: Install Android SDK
        run: |
          SDKM=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build independent VTUAN gate and fake host
        run: |
          gradle --no-daemon -p vtuan_android/gate_v4 :app:assembleDebug
          gradle --no-daemon -p vtuan_android/tool_v12_key_patch/fixture assembleDebug
      - name: Download verified Apktool 2.11.1
        run: |
          curl -fLsS --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar' -o /tmp/apktool.jar
          echo '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  /tmp/apktool.jar' | sha256sum -c -
          java -jar /tmp/apktool.jar --version
      - name: Patch test host and verify output
        run: |
          HOST=$(find vtuan_android/tool_v12_key_patch/fixture/build/outputs/apk -name '*debug.apk' | head -1)
          test -s "$HOST"
          python3 vtuan_android/tool_v12_key_patch/patch_host.py \
            --apk "$HOST" \
            --gate vtuan_android/gate_v4/app/build/outputs/apk/debug/app-debug.apk \
            --apktool /tmp/apktool.jar \
            --output /tmp/vtuan-test-host-patched.apk \
            --keystore /tmp/vtuan-test-host.jks \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --zipalign "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/vtuan-test-host-patched.apk | grep -F "package: name='com.example.vtuantesthost'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/vtuan-test-host-patched.apk | grep -F "launchable-activity: name='com.vtuan.gate.KeyActivity'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree /tmp/vtuan-test-host-patched.apk AndroidManifest.xml | grep -F 'vtuan.original_launcher'
          unzip -Z1 /tmp/vtuan-test-host-patched.apk | grep -E '^classes2.dex$'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose /tmp/vtuan-test-host-patched.apk
